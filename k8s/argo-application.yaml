apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-application
  namespace: gitops
  labels:
    app: argo-cd-application
spec:
  project: default
  source:
    repoURL: https://github.com/RandyBrown12/k3s-project.git
    targetRevision: main
    path: k8s
    directory:
      exclude: 'dummy.yaml'
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true