apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quick-pizza-ingress
  namespace: production
spec:
  ingressClassName: traefik
  rules:
    - host: quick-pizza.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quick-pizza
                port:
                  number: 80